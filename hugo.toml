baseURL = 'https://openeverest.io/'
languageCode = 'en-us'
title = 'OpenEverest'
staticDir = ['static', 'assets']
enableGitInfo = true

# Last-modified date (sitemap <lastmod>, JSON-LD dateModified): an explicit
# `lastmod` in front matter wins, otherwise the file's last git commit.
[frontmatter]
  lastmod = ['lastmod', ':git', 'modified', 'date', 'publishDate']

[params]
  googleAnalyticsID = 'G-JNB0XD7Y6M'
  tagline = 'Open-Source Database Platform'
  description = 'OpenEverest is an open-source platform for automated database provisioning and management. It supports multiple database technologies and can be hosted on any Kubernetes infrastructure, in the cloud or on-premises.'
  author = 'OpenEverest Team'
  defaultSocialImage = '/images/brandkit/hero-image-2x1-ratio.png'

[pagination]
  pagerSize = 10

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
    permalinkable = false

[outputs]
  home = ["HTML", "RSS", "llms"]

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  tag = "tags"